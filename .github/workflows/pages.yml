# Build every web demo in this repo and publish them as one GitHub Pages site,
# each under its own folder. Adding a demo means one entry in
# scripts/build-pages.mjs, not a change here.
#
# Deploys from the Actions artifact rather than a gh-pages branch, so no build
# output is ever committed. Enable it once under
# Settings -> Pages -> Source: "GitHub Actions".

name: Deploy demos to Pages

on:
  push:
    branches: [master, main]
    # Only rebuild when something a demo depends on actually changed.
    paths:
      - 'audio/software-synth/**'
      - 'audio/fm-1/crates/**'
      - 'audio/fm-1/web/**'
      - 'audio/fm-1/Cargo.*'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules left here: the SID Tracker took the jsSID one with it
      # when it moved to its own repository, and the demos this repo still
      # builds are plain source.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audio/software-synth/synthex/package-lock.json

      - name: Install synth workspace
        working-directory: audio/software-synth/synthex
        run: npm ci

      # The FM-1 emulator's page is a Rust crate compiled to WebAssembly.
      - name: Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      # Build BEFORE testing, so the suite runs against the artifact that is
      # about to be deployed. The worklet test can only check a worklet that
      # exists; run it first and it skips, which looks identical to passing.
      - name: Build all demos
        run: node scripts/build-pages.mjs --base "/${{ github.event.repository.name }}/"

      # Covers the DSP and, crucially, that the built AudioWorklet actually
      # loads — a broken one still renders a perfect, silent page. Failing here
      # stops the deploy, because `deploy` needs this job.
      - name: Test the built output
        working-directory: audio/software-synth/synthex
        run: npm test

      # The FM-1 page's wasm must boot a real firmware (Felucca, fetched from its author's
      # site like the page does) to audio and a screen.
      - name: Test the FM-1 emulator build
        working-directory: audio/fm-1
        run: node web/smoke.mjs ../../_site/fm-1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
