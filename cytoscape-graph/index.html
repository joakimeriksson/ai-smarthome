<!DOCTYPE html>
<html>
<head>
  <link href="style.css" rel="stylesheet" />
  <meta charset=utf-8 />
  <meta name="viewport" content="user-scalable=no, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, minimal-ui">
  <title>CS Department Explorer</title>
  <script src="cytoscape.min.js"></script>
  <script src="https://unpkg.com/klayjs@0.4.1/klay.js"></script>
  <script src="https://unpkg.com/cytoscape-klay@3.1.2/cytoscape-klay.js"></script>
</head>
<body>

  <div id="cy"></div>

  <div id="view-switcher">
    <select id="view-select"></select>
  </div>

  <div id="person-link-bar">
    <div id="person-link-search-wrap">
      <input type="text" id="person-link-search" placeholder="Search person to link nodes..." autocomplete="off">
      <div id="person-link-results"></div>
    </div>
    <div id="person-link-active" style="display: none;">
      <span id="person-link-name"></span>
      <span id="person-link-hint">Click nodes to toggle links</span>
      <button id="person-link-done">Done</button>
    </div>
  </div>

  <div id="right-buttons">
    <button id="edit-graph-btn">Edit Graph</button>
    <button id="insights-btn">Insights</button>
    <button id="show-persons-btn">Show Persons</button>
  </div>

  <div id="query-panel" style="display: none;">
    <button id="close-query-panel-btn">&times;</button>
    <h3 id="query-panel-title">Insights</h3>
    <div id="query-panel-body"></div>
  </div>

  <div id="detail-panel" style="display: none;">
    <button id="close-detail-btn">&times;</button>
    <h3 id="detail-title"></h3>
    <div id="detail-type-badge"></div>
    <div id="detail-description"></div>
    <div id="detail-meta"></div>
    <div id="detail-connections"></div>
  </div>

  <div id="persons-display-container" style="display: none;">
    <h3>Persons</h3>
    <ul id="persons-display-list"></ul>
    <button id="close-persons-display-btn">Close</button>
  </div>

  <div id="editor-container" style="display: none;">
    <div id="editor">
      <h2>Graph Editor</h2>

      <div class="editor-section">
        <h3>Nodes</h3>
        <div id="nodes-list"></div>
        <input type="text" id="node-id" placeholder="ID">
        <input type="text" id="node-label" placeholder="Label">
        <textarea id="node-description" placeholder="Description"></textarea>
        <select id="node-type"></select>
        <div id="node-extra-fields"></div>
        <select id="node-image"></select>
        <button id="add-node-btn">Add Node</button>
        <button id="update-node-btn" style="display: none;">Update Node</button>
      </div>

      <div class="editor-section">
        <h3>Edges</h3>
        <div id="edges-list"></div>
        <select id="edge-source"></select>
        <select id="edge-target"></select>
        <select id="edge-type"></select>
        <button id="add-edge-btn">Add Edge</button>
      </div>

      <div class="editor-controls">
        <button id="save-editor-btn">Save & Close</button>
        <button id="export-json-btn">Export to JSON</button>
        <button id="close-editor-btn">Close without saving</button>
      </div>
    </div>
  </div>

  <div id="legend"></div>

  <script src="cytoscape-icons.js"></script>
  <script src="code.js"></script>
  <script src="queries.js"></script>
  <script src="editor.js"></script>

</body>
</html>
