<!doctype html>
<meta charset="utf-8">
<title>ZenCore VA</title>
<style>
  :root { color-scheme: dark; --bg:#14161a; --fg:#e6e8ec; --dim:#8b93a1;
          --line:#2a2f38; --accent:#6ea8ff; --warn:#e0a54a; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,
         SFMono-Regular,Menlo,monospace; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; gap:20px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0; letter-spacing:.14em; text-transform:uppercase; }
  .meta { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:minmax(220px,280px) 1fr; gap:0;
         align-items:start; }
  #tones { border-right:1px solid var(--line); min-height:70vh; }
  #tones button { display:block; width:100%; text-align:left; padding:9px 20px;
      background:none; border:0; border-bottom:1px solid var(--line);
      color:var(--fg); font:inherit; cursor:pointer; }
  #tones button:hover { background:#1b1f26; }
  #tones button[aria-selected=true] { background:#1f2733; color:var(--accent); }
  #tones .no { color:var(--dim); }
  section { padding:16px 20px; }
  table { border-collapse:collapse; font-size:12px; margin:4px 0 18px; }
  td { padding:2px 14px 2px 0; }
  td.k { color:var(--dim); }
  kbd { background:#20242c; border:1px solid var(--line); border-radius:3px;
        padding:1px 5px; font-size:11px; }
  .warn { color:var(--warn); }
  .keys { display:flex; gap:3px; margin-top:10px; flex-wrap:wrap; }
  .keys div { width:34px; height:96px; background:#20242c; border:1px solid var(--line);
      border-radius:0 0 4px 4px; display:flex; align-items:flex-end;
      justify-content:center; padding-bottom:6px; font-size:10px; color:var(--dim);
      cursor:pointer; user-select:none; }
  .keys div.on { background:var(--accent); color:#0d1117; }
</style>

<header>
  <h1>ZenCore VA</h1>
  <span class="meta" id="file">loading…</span>
  <span class="meta" id="status"></span>
  <span class="meta" id="midi">MIDI: …</span>
</header>

<main>
  <div id="tones"></div>
  <section>
    <div id="detail" class="meta">Select a tone.</div>
    <div class="keys" id="keys"></div>
    <p class="meta">Play with <kbd>A</kbd>…<kbd>K</kbd> (white) / <kbd>W</kbd><kbd>E</kbd><kbd>T</kbd><kbd>Y</kbd><kbd>U</kbd> (black),
       <kbd>Z</kbd>/<kbd>X</kbd> octave. Audio starts on first click.</p>
  </section>
</main>

<script type="module">
const $ = (s) => document.querySelector(s);
let ctx, node, patch = null, octave = 4;
const held = new Set();

async function audio() {
  if (ctx) { if (ctx.state === "suspended") await ctx.resume(); return; }
  ctx = new AudioContext();
  await ctx.audioWorklet.addModule("va-worklet.js");
  node = new AudioWorkletNode(ctx, "va-processor", { outputChannelCount: [2] });
  node.connect(ctx.destination);
  node.port.onmessage = (e) => {
    if (e.data.type === "loaded")
      $("#status").textContent = e.data.playable ? "patch loaded" : "not playable (PCM only)";
  };
  if (patch) node.port.postMessage({ type: "patch", patch });
}

const file = await (await fetch("/api/file")).json();
$("#file").textContent =
  `${file.path} — ${file.product} v${file.version} — ${file.tones.length} tones`;

const va = await Promise.all(
  file.tones.map(t => fetch(`/api/tone/${t.index}/va`).then(r => r.json())));

$("#tones").innerHTML = va.map((p, i) =>
  `<button data-i="${i}" aria-selected="false">${p.name}
   <span class="${p.playable ? 'meta' : 'no'}">${
     p.playable ? `VA ×${p.partials.filter(q => q.on && q.synthesised).length}` : "PCM"}</span>
   </button>`).join("");

$("#tones").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  for (const x of $("#tones").children) x.setAttribute("aria-selected", x === b);
  select(va[+b.dataset.i]);
  await audio();
});

function select(p) {
  patch = p;
  if (node) node.port.postMessage({ type: "patch", patch });
  const on = p.partials.filter(q => q.on);
  const lbl = (f) => (f && typeof f === "object" ? f.label : f);
  $("#detail").innerHTML = `
    <table>
      <tr><td class="k">structure</td><td>${lbl(p.structure.pair12)} / ${lbl(p.structure.pair34)}</td></tr>
      <tr><td class="k">partials</td><td>${on.length} on, ${on.filter(q=>q.synthesised).length} synthesised</td></tr>
      ${on.map(q => `<tr><td class="k">partial ${q.index}</td><td>
        ${lbl(q.osc.OSC_TYPE)} ${lbl(q.osc.VA_FORM) ?? ""}
        · ${lbl(q.filter.FILTER_TYPE)} ${q.filter.CUTOFF}/${q.filter.RESO}
        · ${lbl(q.filter.VCF_TYPE)} ${lbl(q.filter.FILTER_SLOPE)}dB
        · crs ${q.pitch.PIT_CRS >= 0 ? "+" : ""}${q.pitch.PIT_CRS}
        ${q.synthesised ? "" : '<span class="warn">(PCM — silent here)</span>'}
      </td></tr>`).join("")}
    </table>`;
}

// -- keyboard --------------------------------------------------------------
const MAP = { a:0, w:1, s:2, e:3, d:4, f:5, t:6, g:7, y:8, h:9, u:10, j:11, k:12 };
const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B","C"];
$("#keys").innerHTML = Object.entries(MAP)
  .map(([k, s]) => `<div data-semi="${s}">${NAMES[s]}<br>${k}</div>`).join("");

function noteOn(semi) {
  const n = 12 * (octave + 1) + semi;
  if (held.has(n)) return;
  held.add(n);
  node?.port.postMessage({ type: "noteOn", note: n, velocity: 100 });
  document.querySelector(`[data-semi="${semi}"]`)?.classList.add("on");
}
function noteOff(semi) {
  const n = 12 * (octave + 1) + semi;
  held.delete(n);
  node?.port.postMessage({ type: "noteOff", note: n });
  document.querySelector(`[data-semi="${semi}"]`)?.classList.remove("on");
}

// -- MIDI in ---------------------------------------------------------------
// Any connected device, plus the IAC bus, so the same MIDI that drives
// Zenology for a capture can drive this for an A/B.
async function midi() {
  if (!navigator.requestMIDIAccess) { $("#midi").textContent = "no Web MIDI"; return; }
  try {
    const access = await navigator.requestMIDIAccess({ sysex: false });
    const bind = () => {
      const names = [];
      for (const input of access.inputs.values()) {
        names.push(input.name);
        input.onmidimessage = onMidi;
      }
      $("#midi").textContent = names.length
        ? `MIDI: ${names.join(", ")}` : "MIDI: no inputs";
    };
    bind();
    access.onstatechange = bind;
  } catch (err) {
    $("#midi").textContent = `MIDI blocked: ${err.message}`;
  }
}

function onMidi(e) {
  const [status, d1, d2] = e.data;
  const cmd = status & 0xf0;
  if (cmd === 0x90 && d2 > 0) {
    audio().then(() => {
      if (held.has(d1)) return;
      held.add(d1);
      node?.port.postMessage({ type: "noteOn", note: d1, velocity: d2 });
      flash(d1, true);
    });
  } else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)) {
    held.delete(d1);
    node?.port.postMessage({ type: "noteOff", note: d1 });
    flash(d1, false);
  } else if (cmd === 0xb0 && d1 === 123) {
    node?.port.postMessage({ type: "allNotesOff" });
  }
}

function flash(note, on) {
  const semi = note - 12 * (octave + 1);
  const el = document.querySelector(`[data-semi="${semi}"]`);
  if (el) el.classList.toggle("on", on);
}

midi();

addEventListener("keydown", async (e) => {
  if (e.repeat) return;
  if (e.key === "z") { octave = Math.max(0, octave - 1); return; }
  if (e.key === "x") { octave = Math.min(8, octave + 1); return; }
  if (!(e.key in MAP)) return;
  await audio(); noteOn(MAP[e.key]);
});
addEventListener("keyup", (e) => { if (e.key in MAP) noteOff(MAP[e.key]); });
$("#keys").addEventListener("pointerdown", async (e) => {
  const d = e.target.closest("[data-semi]"); if (!d) return;
  await audio(); noteOn(+d.dataset.semi);
});
addEventListener("pointerup", () => { for (const d of document.querySelectorAll(".keys .on"))
  noteOff(+d.dataset.semi); });
</script>
